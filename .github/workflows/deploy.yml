name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_SERVER: ${{ github.repository }}-server
  IMAGE_CLIENT: ${{ github.repository }}-client

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      server-image: ${{ steps.meta.outputs.server-image }}
      client-image: ${{ steps.meta.outputs.client-image }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: meta
        run: |
          SERVER_IMAGE="${REGISTRY}/$(echo "${IMAGE_SERVER}" | tr '[:upper:]' '[:lower:]'):${GITHUB_SHA::12}"
          CLIENT_IMAGE="${REGISTRY}/$(echo "${IMAGE_CLIENT}" | tr '[:upper:]' '[:lower:]'):${GITHUB_SHA::12}"
          SERVER_IMAGE_LATEST="${REGISTRY}/$(echo "${IMAGE_SERVER}" | tr '[:upper:]' '[:lower:]'):latest"
          CLIENT_IMAGE_LATEST="${REGISTRY}/$(echo "${IMAGE_CLIENT}" | tr '[:upper:]' '[:lower:]'):latest"
          echo "server-image=${SERVER_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "client-image=${CLIENT_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "SERVER_IMAGE=${SERVER_IMAGE}" >> "$GITHUB_ENV"
          echo "CLIENT_IMAGE=${CLIENT_IMAGE}" >> "$GITHUB_ENV"
          echo "SERVER_IMAGE_LATEST=${SERVER_IMAGE_LATEST}" >> "$GITHUB_ENV"
          echo "CLIENT_IMAGE_LATEST=${CLIENT_IMAGE_LATEST}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build & push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ env.SERVER_IMAGE }},${{ env.SERVER_IMAGE_LATEST }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build & push client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: client/Dockerfile
          push: true
          tags: ${{ env.CLIENT_IMAGE }},${{ env.CLIENT_IMAGE_LATEST }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # `envs` transmet les tags d'image poussés à l'instant au shell
          # distant, pour que le VPS tire exactement ce qui vient d'être buildé
          # plutôt qu'un `latest` potentiellement en cours de publication.
          envs: SERVER_IMAGE,CLIENT_IMAGE
          script: |
            set -e
            cd "${{ secrets.VPS_DEPLOY_PATH }}"
            git pull --ff-only
            echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            echo "SERVER_IMAGE=${SERVER_IMAGE}" > .env.deploy
            echo "CLIENT_IMAGE=${CLIENT_IMAGE}" >> .env.deploy
            docker compose -f docker-compose.prod.yml --env-file .env.deploy pull
            docker compose -f docker-compose.prod.yml --env-file .env.deploy up -d --remove-orphans
            docker image prune -f
        env:
          SERVER_IMAGE: ${{ needs.build-and-push.outputs.server-image }}
          CLIENT_IMAGE: ${{ needs.build-and-push.outputs.client-image }}

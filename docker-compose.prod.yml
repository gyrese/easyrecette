# Compose de déploiement : utilisé tel quel sur le VPS. Contrairement à
# docker-compose.yml (qui build les images localement, pratique en dev), ce
# fichier ne fait que `pull` les images déjà construites par GitHub Actions et
# poussées sur ghcr.io — le VPS n'a jamais besoin du code source applicatif.
#
# Déploiement (voir DEPLOY.md) — manuel, en SSH sur le VPS :
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

name: easyrecette

services:
  server:
    image: ghcr.io/gyrese/easyrecette-server:latest
    restart: unless-stopped
    env_file:
      - server/.env
    environment:
      DATABASE_URL: file:/app/server/data/prod.db
      NODE_ENV: production
    volumes:
      - db:/app/server/data
      - media:/app/server/media
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  client:
    image: ghcr.io/gyrese/easyrecette-client:latest
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  db:
  media:

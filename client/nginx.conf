# Sert le build statique du client et fait reverse-proxy vers l'API,
# reproduisant en production le proxy dev de vite.config.ts.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    # Fichiers hashés par Vite (assets/*) : cache long, le nom change au contenu.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Le service worker et le manifeste PWA ne doivent jamais être mis en
    # cache par un intermédiaire : sinon les clients restent bloqués sur
    # une ancienne version de l'app.
    location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest|workbox-.*\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # API : transmise telle quelle au serveur Node (même préfixe /api).
    location /api/ {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vidéos et vignettes des recettes importées, servies par le serveur.
    location /media/ {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA : toute route inconnue retombe sur index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}

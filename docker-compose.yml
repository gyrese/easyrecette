name: easyrecette

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: ${SERVER_IMAGE:-easyrecette-server}
    restart: unless-stopped
    env_file:
      - server/.env
    environment:
      # Surchages figées pour l'environnement conteneurisé : le fichier
      # SQLite vit sur le volume `db`, jamais dans l'image (voir Dockerfile).
      DATABASE_URL: file:/app/server/data/prod.db
      NODE_ENV: production
    volumes:
      - db:/app/server/data
      - media:/app/server/media
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    image: ${CLIENT_IMAGE:-easyrecette-client}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  db:
  media:
